name: Flickplay
description: >-
  Flickplay, Inc. is a Web3 social and gaming company that turns character
  intellectual property into portable, interactive, and monetizable experiences
  across user-generated content, social platforms, and real-world retail
  activations. Its consumer iOS app combines character-based gameplay (blind
  boxes, spin games, leveling), AR video and GIF creation tools, AI character
  chat, iOS home-screen widgets, a quest system tying gameplay to e-commerce,
  and a Fandom Intelligence dashboard tracking fan identity, behavior, and
  spend. Flickplay is a portfolio company of Lightspeed Venture Partners. As of
  mid-2026 the company published a suspension notice, and it exposes no public
  developer API, documentation, or developer portal — this profile is
  identity-only.
